services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in a .env file}
    volumes:
      - db-data:/var/opt/mssql
    ports:
      - "1433:1433"

  api:
    build: ./server/ExpenseTracker.Api
    environment:
      ConnectionStrings__DefaultConnection: Server=db;Database=expensetracker;User Id=sa;Password=${DB_PASSWORD:?set DB_PASSWORD in a .env file};TrustServerCertificate=True;
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in a .env file}
      Jwt__Issuer: ExpenseTracker.Api
      Jwt__Audience: ExpenseTracker.Client
      AllowedOrigins__0: http://localhost:8080
    depends_on:
      - db
    ports:
      - "5254:8080"

  client:
    build: ./client
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db-data:
