services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in a .env file}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./server/ExpenseTracker.Api
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Database=expense_tracker;Username=expense_app;Password=${DB_PASSWORD:?set DB_PASSWORD in a .env file}
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in a .env file}
      Jwt__Issuer: ExpenseTracker.Api
      Jwt__Audience: ExpenseTracker.Client
      AllowedOrigins__0: http://localhost:8080
    depends_on:
      - db
    ports:
      - "5254:8080"

  client:
    build: ./client
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db-data:
