<div class="shell">
  <aside class="sidebar">
    <div class="brand">💰 ExpenseTracker</div>
    <nav>
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <span class="user-name">{{ auth.currentUser()?.name }}</span>
        <span class="user-email text-muted">{{ auth.currentUser()?.email }}</span>
      </div>
      <button class="btn btn-secondary logout-btn" (click)="logout()">Log out</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
