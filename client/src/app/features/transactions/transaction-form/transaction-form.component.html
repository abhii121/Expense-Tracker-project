<form class="card transaction-form" [formGroup]="form" (ngSubmit)="submit()">
  <h2>{{ editing() ? 'Edit transaction' : 'New transaction' }}</h2>

  <div class="form-row">
    <div class="form-field">
      <label for="type">Type</label>
      <select id="type" formControlName="type" (change)="onTypeChange()">
        <option value="Expense">Expense</option>
        <option value="Income">Income</option>
      </select>
    </div>

    <div class="form-field">
      <label for="amount">Amount</label>
      <input id="amount" type="number" step="0.01" min="0.01" formControlName="amount" />
    </div>
  </div>

  <div class="form-row">
    <div class="form-field">
      <label for="categoryId">Category</label>
      <select id="categoryId" formControlName="categoryId">
        @for (category of filteredCategories; track category.id) {
          <option [value]="category.id">{{ category.name }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="date">Date</label>
      <input id="date" type="date" formControlName="date" />
    </div>
  </div>

  <div class="form-field">
    <label for="note">Note (optional)</label>
    <input id="note" type="text" formControlName="note" placeholder="e.g. Groceries at Whole Foods" />
  </div>

  @if (errorMessage()) {
    <p class="field-error">{{ errorMessage() }}</p>
  }

  <div class="form-actions">
    <button type="button" class="btn btn-secondary" (click)="cancel.emit()">Cancel</button>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form>
